name: Pidgin-Renew

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOST_PROXY: ${{ secrets.GOST_PROXY }}

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Pidgin-Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: cp private/ph_renew.py ph_renew.py

      - name: 🐍 安装依赖
        run: pip install requests pysocks

      - name: 🛡️ 启动 GOST 代理转发
        if: ${{ env.GOST_PROXY != '' }}
        continue-on-error: true
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3

      - name: 🔄 执行自动续期
        env:
          PH_USER: ${{ secrets.PH_USER }}
          PH_PASSWORD: ${{ secrets.PH_PASSWORD }}
          CRON_JOB: ${{ secrets.CRON_JOB }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: python ph_renew.py
